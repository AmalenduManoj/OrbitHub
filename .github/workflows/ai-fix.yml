name: AI Issue Fixer

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  solve:
    if: github.event.label.name == 'solarbeam' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comment start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "☀️ balbasaur started working on issue #${{ github.event.issue.number }}..."

      - name: Check for existing PR
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --head balbasaur/issue-${{ github.event.issue.number }} \
              --json number -q '.[0].number' | grep -q .; then
            echo "PR already exists — skipping agent run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify API key secret
        id: verify
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install mini-swe-agent
        if: steps.guard.outputs.skip != 'true' && steps.verify.outcome != 'failure'
        run: |
          pip install mini-swe-agent
          mini-extra config set MSWEA_CONFIGURED 'true'
          mini-extra config set OPENROUTER_API_KEY '${{ secrets.OPENROUTER_API_KEY }}'

      - name: Build task text
        if: steps.guard.outputs.skip != 'true' && steps.verify.outcome != 'failure'
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK="$(gh issue view ${{ github.event.issue.number }} \
            --json title,body -q '.title + "\n\n" + .body')"
          {
            echo "task<<EOF"
            echo "$TASK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run balbasaur on issue
        id: run
        if: steps.guard.outputs.skip != 'true' && steps.verify.outcome != 'failure'
        continue-on-error: true
        env:
          TASK: ${{ steps.task.outputs.task }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          mini -t "$TASK" -y --exit-immediately \
            -m openrouter/openai/gpt-oss-20b:free \
            -l 0 \
            -o /tmp/balbasaur.traj.json 2>&1 | tee /tmp/balbasaur.log
          exit ${PIPESTATUS[0]}

      - name: Commit changes and open PR
        id: commit
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "balbasaur"
          git config user.email "balbasaur@users.noreply.github.com"
          git checkout -b balbasaur/issue-${{ github.event.issue.number }}
          git add -A
          if git diff --cached --quiet; then
            echo "Agent finished without producing changes"
            exit 1
          fi
          git commit -m "AI fix for #${{ github.event.issue.number }}"
          git push origin balbasaur/issue-${{ github.event.issue.number }}
          PR_URL="$(gh pr create --base ${{ github.event.repository.default_branch }} \
            --head balbasaur/issue-${{ github.event.issue.number }} \
            --title "Fix #${{ github.event.issue.number }}" \
            --body "This PR was generated by **balbasaur** (mini-swe-agent) for issue #${{ github.event.issue.number }}. Please review before merging.")"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment outcome
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outcome }}" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} \
              --body "✅ balbasaur fixed issue #${{ github.event.issue.number }} — PR: ${{ steps.commit.outputs.pr_url }}"
          elif [ "${{ steps.verify.outcome }}" = "failure" ]; then
            gh issue comment ${{ github.event.issue.number }} \
              --body "❌ balbasaur couldn't start — the \`OPENROUTER_API_KEY\` secret is missing. Add it under Settings → Secrets and variables → Actions, then re-label this issue."
          elif [ "${{ steps.run.outcome }}" = "failure" ]; then
            {
              echo "❌ balbasaur crashed while working on issue #${{ github.event.issue.number }}:"
              echo '```'
              tail -n 20 /tmp/balbasaur.log 2>/dev/null || echo "(no agent output captured)"
              echo '```'
            } > /tmp/comment.md
            gh issue comment ${{ github.event.issue.number }} --body-file /tmp/comment.md
          else
            gh issue comment ${{ github.event.issue.number }} \
              --body "🤔 balbasaur ran on issue #${{ github.event.issue.number }} but could not produce a fix. Check the workflow run logs for details."
          fi
